<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주파수 · 로그인</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <div class="auth-logo brand">📡 주파수</div>
      <div class="auth-sub">아이디로 접속해서 대화를 이어가요</div>

      <div class="auth-error" id="loginError"></div>

      <div class="field">
        <label>아이디</label>
        <input type="text" id="loginUsername" autocomplete="username" placeholder="예: minsu">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호">
      </div>
      <button class="btn-primary" id="loginBtn">로그인</button>

      <div class="switch-line">아직 계정이 없나요? <a id="showSignup">회원가입</a></div>
    </div>

    <!-- 회원가입 폼 -->
    <div id="signupForm" class="hidden">
      <div class="auth-logo brand">📡 주파수</div>
      <div class="auth-sub">새 아이디를 만들어 대화를 시작해요</div>

      <div class="auth-error" id="signupError"></div>

      <div class="field">
        <label>아이디 (영문/숫자, 3~20자)</label>
        <input type="text" id="signupUsername" autocomplete="username" placeholder="예: minsu">
      </div>
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="signupNickname" placeholder="상대에게 보일 이름">
      </div>
      <div class="field">
        <label>비밀번호 (6자 이상)</label>
        <input type="password" id="signupPassword" autocomplete="new-password" placeholder="비밀번호">
      </div>
      <button class="btn-primary" id="signupBtn">가입하기</button>

      <div class="switch-line">이미 계정이 있나요? <a id="showLogin">로그인</a></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
