<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASTANEA · 로그인</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="auth-wrap">
  <button class="icon-btn theme-swatch" id="themeBtn" title="테마 설정" style="position:absolute; top:20px; right:20px;"></button>

  <div class="auth-card">

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <div class="auth-logo brand">CASTANEA</div>

      <div class="auth-error" id="loginError"></div>

      <div class="field">
        <label>아이디</label>
        <input type="text" id="loginUsername" autocomplete="username" placeholder="예: minsu">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호">
      </div>
      <button class="btn-primary" id="loginBtn">로그인</button>

      <div class="switch-line">아직 계정이 없나요? <a id="showSignup">회원가입</a></div>
    </div>

    <!-- 회원가입 폼 -->
    <div id="signupForm" class="hidden">
      <div class="auth-logo brand">CASTANEA</div>

      <div class="auth-error" id="signupError"></div>

      <div class="field">
        <label>아이디 (영문/숫자, 3~20자)</label>
        <input type="text" id="signupUsername" autocomplete="username" placeholder="예: minsu">
      </div>
      <div class="field">
        <label>닉네임</label>
        <input type="text" id="signupNickname" placeholder="상대에게 보일 이름">
      </div>
      <div class="field">
        <label>비밀번호 (6자 이상)</label>
        <input type="password" id="signupPassword" autocomplete="new-password" placeholder="비밀번호">
      </div>
      <button class="btn-primary" id="signupBtn">가입하기</button>

      <div class="switch-line">이미 계정이 있나요? <a id="showLogin">로그인</a></div>
    </div>

  </div>
</div>

<!-- 테마 설정 모달 -->
<div class="modal-backdrop hidden" id="themeModal">
  <div class="modal">
    <h3 class="brand">테마 설정</h3>
    <p>배경, 카드, 포인트 색을 원하는 대로 바꿔보세요.</p>

    <div class="theme-section">
      <div class="dark-toggle-row">
        <span>다크 모드</span>
        <label class="switch">
          <input type="checkbox" id="darkModeToggle">
          <span class="switch-track"></span>
        </label>
      </div>
    </div>

    <div class="theme-section">
      <div class="theme-section-label">프리셋</div>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>

    <div class="theme-section">
      <div class="theme-section-label">직접 고르기</div>
      <div class="custom-color-row">
        <span>배경색</span>
        <input type="color" id="customBgColor">
      </div>
      <div class="custom-color-row">
        <span>카드색</span>
        <input type="color" id="customPanelColor">
      </div>
      <div class="custom-color-row">
        <span>포인트색</span>
        <input type="color" id="customAccentColor">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-primary" id="closeTheme" style="margin-top:0;">완료</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
